<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pagamento concluído</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        .box {
            background: white;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            max-width: 420px;
        }

        h1 {
            margin-bottom: 12px;
        }

        p {
            color: #666;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <div class="box">
        <h1>Pagamento concluído!</h1>
        <p>
            Obrigado pela contratação.<br>
            Você pode fechar esta página e retornar ao WhatsApp.
        </p>
    </div>

</body>
</html>
